[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-applications"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langgraph==1.2.23",
  "langgraph-checkpoint-sqlite>=3,<4",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "python-dotenv==1.2.4",
  "psycopg[binary]==3.3.8",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[project.scripts]
linkedin-applications = "linkedin_applications.worker:main"

[tool.setuptools.package-data]
linkedin_applications = ["resources/*.txt"]
